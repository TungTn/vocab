version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: linguaflow-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linguaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linguaflow_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-linguaflow}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linguaflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linguaflow-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-linguaflow_redis_secret}
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-linguaflow_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: linguaflow-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
    volumes:
      - minio_prod_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: linguaflow-prod-api
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-linguaflow}:${POSTGRES_PASSWORD:-linguaflow_secure_pwd}@postgres:5432/${POSTGRES_DB:-linguaflow}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-linguaflow_redis_secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-linguaflow_jwt_secret_key_prod_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-linguaflow_refresh_token_secret_prod_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: linguaflow-prod-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/api
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    container_name: linguaflow-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
